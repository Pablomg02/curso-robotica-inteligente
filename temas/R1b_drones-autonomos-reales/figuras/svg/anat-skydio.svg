<svg viewBox="0 0 600 290" style="max-height:330px" role="img" aria-label="Arquitectura publicada: sensores, estimación, autonomía, control, cómputo, enlace y operación (skydio)">
<rect x="6" y="8" width="140" height="152" rx="8" class="box-accent"/>
<text x="76.0" y="28.0" text-anchor="middle" font-size="14" class="t-bold t-accent">Sensores</text>
<text x="14.0" y="50.0" font-size="12">6 cámaras de 32 MP</text>
<text x="14.0" y="69.0" font-size="12">trinocular arriba</text>
<text x="14.0" y="88.0" font-size="12">y abajo, 200°</text>
<text x="14.0" y="107.0" font-size="12">GNSS</text>
<line x1="147.0" y1="84.0" x2="156.0" y2="84.0" class="ln"/>
<polygon points="156,84.0 151,80.0 151,88.0" class="fill-ink3"/>
<rect x="158" y="8" width="140" height="152" rx="8" class="box-time"/>
<text x="228.0" y="28.0" text-anchor="middle" font-size="14" class="t-bold t-time">Estimación</text>
<text x="166.0" y="50.0" font-size="12">VIO: ±10 cm</text>
<text x="166.0" y="69.0" font-size="12">GNSS: ±1 m</text>
<text x="166.0" y="88.0" font-size="12">X10D: sin GPS (E)</text>
<text x="166.0" y="107.0" font-size="12" class="t-faint">estimador: no publicado</text>
<line x1="299.0" y1="84.0" x2="308.0" y2="84.0" class="ln"/>
<polygon points="308,84.0 303,80.0 303,88.0" class="fill-ink3"/>
<rect x="310" y="8" width="140" height="152" rx="8" class="box-tesis"/>
<text x="380.0" y="28.0" text-anchor="middle" font-size="14" class="t-bold t-tesis">Autonomía</text>
<text x="318.0" y="50.0" font-size="12">evitación 360°</text>
<text x="318.0" y="69.0" font-size="12">percibe hasta 20 m</text>
<text x="318.0" y="88.0" font-size="12">16 m/s con evitación</text>
<text x="318.0" y="107.0" font-size="12" class="t-faint">planificador: no publ.</text>
<line x1="451.0" y1="84.0" x2="460.0" y2="84.0" class="ln"/>
<polygon points="460,84.0 455,80.0 455,88.0" class="fill-ink3"/>
<rect x="462" y="8" width="140" height="152" rx="8" class="box"/>
<text x="532.0" y="28.0" text-anchor="middle" font-size="14" class="t-bold">Control</text>
<text x="470.0" y="50.0" font-size="12">20 m/s máx.</text>
<text x="470.0" y="69.0" font-size="12">viento 12,8 m/s</text>
<text x="470.0" y="88.0" font-size="12" class="t-faint">lazos: no publicados</text>
<rect x="6" y="168" width="596" height="26" rx="6" class="box-soft"/>
<text x="304.0" y="186.0" text-anchor="middle" font-size="12" class="t-bold">Cómputo: NVIDIA Jetson Orin + Snapdragon 865 (sin TOPS)</text>
<rect x="6.0" y="202" width="292.0" height="82" rx="8" class="box-soft"/>
<text x="14.0" y="220.0" font-size="13" class="t-bold">Enlace</text>
<text x="14.0" y="239.0" font-size="12">Connect SL: 12 km (WiFi 6)</text>
<text x="14.0" y="256.0" font-size="12">Connect 5G: donde haya cobertura</text>
<text x="14.0" y="273.0" font-size="12" class="t-faint">latencia: no publicada</text>
<rect x="310.0" y="202" width="292.0" height="82" rx="8" class="box-soft"/>
<text x="318.0" y="220.0" font-size="13" class="t-bold">Operación</text>
<text x="318.0" y="239.0" font-size="12">docks: > 1000 en policía (E)</text>
<text x="318.0" y="256.0" font-size="12">≈ 100 000 misiones/mes (E)</text>
<text x="318.0" y="273.0" font-size="12">2,11 kg; 40 min (laboratorio)</text>
