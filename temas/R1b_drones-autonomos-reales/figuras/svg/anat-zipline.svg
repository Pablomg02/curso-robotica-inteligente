<svg viewBox="0 0 600 290" style="max-height:330px" role="img" aria-label="Arquitectura publicada: sensores, estimación, autonomía, control, cómputo, enlace y operación (zipline)">
<rect x="6" y="8" width="140" height="152" rx="8" class="box-accent"/>
<text x="76.0" y="28.0" text-anchor="middle" font-size="14" class="t-bold t-accent">Sensores</text>
<text x="14.0" y="50.0" font-size="12">GNSS</text>
<text x="14.0" y="69.0" font-size="12">DAA a bordo (E)</text>
<text x="14.0" y="88.0" font-size="12" class="t-faint">resto: no publicado</text>
<line x1="147.0" y1="84.0" x2="156.0" y2="84.0" class="ln"/>
<polygon points="156,84.0 151,80.0 151,88.0" class="fill-ink3"/>
<rect x="158" y="8" width="140" height="152" rx="8" class="box-time"/>
<text x="228.0" y="28.0" text-anchor="middle" font-size="14" class="t-bold t-time">Estimación</text>
<text x="166.0" y="50.0" font-size="12" class="t-faint">no publicado</text>
<line x1="299.0" y1="84.0" x2="308.0" y2="84.0" class="ln"/>
<polygon points="308,84.0 303,80.0 303,88.0" class="fill-ink3"/>
<rect x="310" y="8" width="140" height="152" rx="8" class="box-tesis"/>
<text x="380.0" y="28.0" text-anchor="middle" font-size="14" class="t-bold t-tesis">Autonomía</text>
<text x="318.0" y="50.0" font-size="12">ruta generada</text>
<text x="318.0" y="69.0" font-size="12">justo antes del vuelo</text>
<text x="318.0" y="88.0" font-size="12">desconflicción V2V</text>
<text x="318.0" y="107.0" font-size="12">sigue sin enlace</text>
<text x="318.0" y="126.0" font-size="12">fuera de zona: termina</text>
<line x1="451.0" y1="84.0" x2="460.0" y2="84.0" class="ln"/>
<polygon points="460,84.0 455,80.0 455,88.0" class="fill-ink3"/>
<rect x="462" y="8" width="140" height="152" rx="8" class="box"/>
<text x="532.0" y="28.0" text-anchor="middle" font-size="14" class="t-bold">Control</text>
<text x="470.0" y="50.0" font-size="12">5 hélices; ala de 2,4 m</text>
<text x="470.0" y="69.0" font-size="12">47 mph a 330 ft</text>
<text x="470.0" y="88.0" font-size="12">droid por cable</text>
<text x="470.0" y="107.0" font-size="12">paracaídas («paraland»)</text>
<text x="470.0" y="126.0" font-size="12" class="t-faint">lazos: no publicados</text>
<rect x="6" y="168" width="596" height="26" rx="6" class="box-soft"/>
<text x="304.0" y="186.0" text-anchor="middle" font-size="12" class="t-faint">Cómputo de a bordo: no publicado</text>
<rect x="6.0" y="202" width="292.0" height="82" rx="8" class="box-soft"/>
<text x="14.0" y="220.0" font-size="13" class="t-bold">Enlace</text>
<text x="14.0" y="239.0" font-size="12">radio y red móvil</text>
<text x="14.0" y="256.0" font-size="12">V2V: posición, velocidad, intención</text>
<text x="14.0" y="273.0" font-size="12">piloto remoto (RPIC) que supervisa</text>
<rect x="310.0" y="202" width="292.0" height="82" rx="8" class="box-soft"/>
<text x="318.0" y="220.0" font-size="13" class="t-bold">Operación</text>
<text x="318.0" y="239.0" font-size="12">hasta 400 vuelos/día por sitio</text>
<text x="318.0" y="256.0" font-size="12">radio de 10 millas</text>
<text x="318.0" y="273.0" font-size="12">< 63 lb con 8 lb de carga</text>
