<text x="81.0" y="190.0" text-anchor="middle" font-size="12" class="t-faint">sesgo de hasta 30°</text>
<rect x="196" y="10" width="160" height="58" rx="8" class="box-time"/>
<text x="276.0" y="29.0" text-anchor="middle" font-size="12" class="t-bold">mapa de alturas local</text>
<text x="276.0" y="46.0" text-anchor="middle" font-size="12">celdas de 1 m</text>
<rect x="196" y="186" width="160" height="70" rx="8" class="box-soft"/>
<text x="276.0" y="205.0" text-anchor="middle" font-size="12" class="t-bold">mapa de alturas previo</text>
<text x="276.0" y="222.0" text-anchor="middle" font-size="12">de nubes de puntos</text>
<text x="276.0" y="239.0" text-anchor="middle" font-size="12" class="t-faint">abiertas (precalculado)</text>
<rect x="396" y="30" width="196" height="110" rx="8" class="box-tesis"/>
<text x="494.0" y="49.0" text-anchor="middle" font-size="12" class="t-bold t-tesis">filtro de partículas</text>
