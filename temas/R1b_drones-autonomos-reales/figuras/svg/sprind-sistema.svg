<text x="494.0" y="83.0" text-anchor="middle" font-size="12">predice con odometría</text>
<text x="494.0" y="100.0" text-anchor="middle" font-size="12">y brújula; pesa con la</text>
<text x="494.0" y="117.0" text-anchor="middle" font-size="12">correlación de bordes > 5 m</text>
