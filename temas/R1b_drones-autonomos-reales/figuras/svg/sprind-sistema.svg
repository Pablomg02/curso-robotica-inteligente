<svg viewBox="0 0 600 262" style="max-height:250px" role="img" aria-label="Sistema ganador de SPRIN-D: LiDAR, odometría y brújula fusionados con un mapa de alturas previo en un filtro de partículas">
<rect x="6" y="10" width="150" height="58" rx="8" class="box-accent"/>
<text x="81.0" y="29.0" text-anchor="middle" font-size="12" class="t-bold">LiDAR Livox Mid-360</text>
<text x="81.0" y="46.0" text-anchor="middle" font-size="12">nube de puntos</text>
<rect x="6" y="82" width="150" height="58" rx="8" class="box-accent"/>
<text x="81.0" y="101.0" text-anchor="middle" font-size="12" class="t-bold">IMU + cámara D435</text>
<text x="81.0" y="118.0" text-anchor="middle" font-size="12">VIO (odometría)</text>
<rect x="6" y="154" width="150" height="58" rx="8" class="box-accent"/>
